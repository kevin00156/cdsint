[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdsint"
# Read off engine/codesys_constants.py rather than copied here. Two names
# for one constant is a parallel path, and this one drifted the moment a
# release needed three files edited by hand (SPEC 8, PRINCIPLES 7).
dynamic = ["version"]
description = "Drive CODESYS-family IDEs from outside: sync .st text, build, verify"
readme = "readMe.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
cdsint = "cdsint.cli:main"

[project.urls]
Homepage = "https://github.com/kevin00156/cdsint"

[tool.setuptools.dynamic]
version = {attr = "engine.codesys_constants.SCRIPT_VERSION"}

# engine/ and cds/ are shipped because the IDE-side code has to sit next to the
# CLI in one install root (SPEC 5.3): the stubs put that root on sys.path and
# import both halves from it. Only cdsint/ is ever imported by CPython.
[tool.setuptools]
packages = ["cds", "cds.core", "cds.ide", "cdsint", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
