name: CI

on:
  # Every branch, not just main: a branch whose tests nobody ran is a
  # branch nobody can merge without running them by hand (SPEC 8).
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    # Two operating systems for two different jobs. windows-latest is the real
    # target: the IDE only exists there. ubuntu-latest is the portability
    # guard -- it is the only thing that catches a Windows path handled with
    # os.path, because on Windows that mistake cannot fail.
    name: core unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
